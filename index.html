<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swin AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0a0a0a;
    color: #eee;
    font-family: Arial, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 16px;
    background: #191919;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
}

#status {
    color: #888;
    font-size: 13px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 90%;
    padding: 12px 15px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #075c4b;
}

.ai {
    align-self: flex-start;
    background: #252525;
    border: 1px solid #333;
}

.message img {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
}

#input-area {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #191919;
    border-top: 1px solid #333;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    background: #292929;
    color: white;
    border: 1px solid #444;
    border-radius: 20px;
    padding: 12px;
    font-size: 16px;
    outline: none;
}

button {
    background: #087cff;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 16px;
    font-size: 18px;
}

button:disabled {
    opacity: 0.5;
}

#new-chat {
    background: #333;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <b>swin AI</b>
    <span id="status">Ожидание подключения</span>
    <button id="new-chat">Новый чат</button>
</header>

<div id="chat">
    <div class="message ai">
        Привет! Я swin AI.

        Напиши мне что-нибудь.
        Для создания картинки используй /img описание.
    </div>
</div>

<div id="input-area">
    <textarea id="input"
        placeholder="Напиши сообщение..."
        rows="1"></textarea>
    <button id="send">➤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusText = document.getElementById("status");

let history = [];
let busy = false;

function addMessage(text, role, imageUrl = null) {
    const div = document.createElement("div");
    div.className = "message " + role;

    const textNode = document.createElement("div");
    textNode.textContent = text;
    div.appendChild(textNode);

    if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = "Созданное изображение";
        img.loading = "lazy";
        div.appendChild(img);
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage() {
    const text = input.value.trim();

    if (!text || busy) return;

    busy = true;
    send.disabled = true;

    addMessage(text, "user");
    input.value = "";
    input.style.height = "auto";

    const isImage = text.toLowerCase().startsWith("/img");
    const prompt = isImage ? text.slice(4).trim() : text;

    const loading = addMessage("swin AI думает...", "ai");

    try {
        const endpoint = isImage
            ? "/api/image"
            : "/api/chat";

        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                prompt: prompt,
                history: history
            })
        });

        if (!response.ok) {
            throw new Error("Ошибка сервера: " + response.status);
        }

        const data = await response.json();

        loading.remove();

        if (isImage) {
            if (!data.imageUrl) {
                throw new Error("Сервер не вернул картинку");
            }

            addMessage("Готово!", "ai", data.imageUrl);
        } else {
            if (!data.reply) {
                throw new Error("Пустой ответ ИИ");
            }

            addMessage(data.reply, "ai");

            history.push({
                role: "user",
                content: text
            });

            history.push({
                role: "assistant",
                content: data.reply
            });
        }

        statusText.textContent = "Подключено";

    } catch (error) {
        loading.remove();

        addMessage(
            "Не удалось получить ответ.\n" +
            error.message +
            "\n\nСервер ИИ ещё не подключён.",
            "ai"
        );

        statusText.textContent = "Нет подключения";
    }

    busy = false;
    send.disabled = false;
    input.focus();
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

input.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = this.scrollHeight + "px";
});

document.getElementById("new-chat").onclick = function() {
    history = [];
    chat.innerHTML = "";

    addMessage(
        "Новый чат создан. Что будем обсуждать?",
        "ai"
    );
};
</script>

</body>
</html>
